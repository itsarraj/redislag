[package]
name = "redislag"
version = "0.1.0"
edition = "2021"
description = "Reports Redis replication lag and slowlog contents from a hand-rolled RESP client — no redis-cli, no redis crate"
license = "MIT"
authors = ["Animesh Raj <animesh080808@gmail.com>"]
repository = "https://github.com/itsarraj/redislag"
readme = "README.md"
keywords = ["redis", "replication", "slowlog", "monitoring", "cli"]
categories = ["command-line-utilities"]

[lib]
name = "redislag"
path = "src/lib.rs"

[[bin]]
name = "redislag"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
